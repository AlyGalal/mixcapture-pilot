name: Publish verified experimental build 4

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify complete build and publish its exact artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 40252256034 --json conclusion --jq '.conclusion')" = 'success'
          test "$(gh run view 40252256034 --json headSha --jq '.headSha')" = '887f54a3e596a21fee5b98a168e1d0559906b661'
          gh run download 40252256034 --name mixcapture-unsigned --dir artifact
          gh run download 40252256034 --name ui-screenshots --dir ui
          cd artifact
          sed 's@build/@@' SHA256SUMS.txt | sha256sum -c -
          gh release upload pilot-v0.4.0 MixCapture-unsigned.ipa SHA256SUMS.txt build-info.txt --clobber
          cp ../ui/01-home.png UI-home.png
          cp ../ui/07-home-dark.png UI-home-dark.png
          cp ../ui/02-library.png UI-library.png
          cp ../ui/04-expenses.png UI-expenses.png
          gh release upload pilot-v0.4.0 UI-home.png UI-home-dark.png UI-library.png UI-expenses.png --clobber
          gh release edit pilot-v0.4.0 --draft=false
