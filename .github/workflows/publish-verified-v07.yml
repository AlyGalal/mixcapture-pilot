name: Publish verified experimental build 7

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify complete checks and publish exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          source='2175bf993a9a3e4ae82abcfa4f750da268ab716c'
          for run in 40387475961 40387201460; do
            test "$(gh run view "$run" --json conclusion --jq '.conclusion')" = 'success'
            test "$(gh run view "$run" --json headSha --jq '.headSha')" = "$source"
          done
          gh run download 40387475961 --name mixcapture-unsigned --dir artifact
          gh run download 40387201460 --name daily-scenario-audit --dir audit
          cd artifact
          sed 's@build/@@' SHA256SUMS.txt | sha256sum -c -
          python3 - <<'PYCODE'
          import zipfile, plistlib, hashlib, json
          with zipfile.ZipFile('MixCapture-unsigned.ipa') as z:
              names=z.namelist()
              info=plistlib.loads(z.read('Payload/MixCapture.app/Info.plist'))
              assert info['CFBundleVersion']=='7'
              assert info['CFBundleIdentifier']=='com.mixcapture.pilot'
              assert info['CFBundleDevelopmentRegion']=='en'
              assert info['CFBundleSupportedPlatforms']==['iPhoneOS']
              assert not any(n.lower().endswith(('.wav','.m4a','.mp3','.aac')) for n in names)
              assert len([n for n in names if n.endswith('.bin')])==1
              with z.open('Payload/MixCapture.app/ggml-codeswitch-medium-q8_0.bin') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()=='42ad913750c5487f8fb7bb9d45033fc06443d59d387c797b02632f639d46fbdd'
          with open('../audit/results.json') as f:
              report=json.load(f)
          assert report['schema_version']==2 and len(report['cases'])==100
          assert all(not case['executed_actions'] for case in report['cases'])
          assert sum(report['summary'].values())==100
          print('Verified build 7, unchanged pinned model, no packaged audio, and synthetic audit.')
          PYCODE
          cp ../audit/report.html Daily-life-100-Build7.html
          cp ../audit/results.json Daily-life-100-results-Build7.json
          cat > release-notes.txt <<'NOTES'
          Build 7 improves routing for colloquial Arabic and mixed shopping-list requests. New-list items stay in review until a name is supplied, with shared validation against accidental merging into existing collections. Purchase timing becomes a separate review task; notifications need an explicit reminder request. Calendar-target commands and natural English recipe headers keep their intended types. Unresolved references, update requests and unsupported idea-development requests wait for review.

          Dedicated checks cover 23 synthetic shopping inputs and persisted-state rules, plus 70 adversarial source cases. On the unchanged 100-scenario parser audit: 22 field matches, 17 safe review holds, 61 remaining interpretation/review/capability gaps, and no automatic-review-gate gaps in that corpus. This is not 100 supported features or an audio-accuracy test.

          Existing saved Notes retain their type until edited. The ASR model is unchanged. No personal recordings/transcripts are included. Update the existing app with the same signing account, without deleting it. Confirm 1.0 (build 7) in Settings after installation; installer completion alone is not version proof.
          NOTES
          mv MixCapture-unsigned.ipa MixCapture-Build7.ipa
          sha256sum MixCapture-Build7.ipa > SHA256SUMS.txt
          gh release create pilot-v0.7.0 --target "$source" --title 'MixCapture build 7 — command routing' --notes-file release-notes.txt --prerelease --draft
          gh release upload pilot-v0.7.0 MixCapture-Build7.ipa SHA256SUMS.txt build-info.txt Daily-life-100-Build7.html Daily-life-100-results-Build7.json
          gh release edit pilot-v0.7.0 --draft=false
