name: Publish verified experimental build 5

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify complete build and publish its exact artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 40280976048 --json conclusion --jq '.conclusion')" = 'success'
          test "$(gh run view 40280976048 --json headSha --jq '.headSha')" = '2b8bb9da51cc4e48fbcc8e5c26ad6e3fbe4da47d'
          gh run download 40280976048 --name mixcapture-unsigned --dir artifact
          gh run download 40280976048 --name ui-screenshots --dir ui
          cd artifact
          sed 's@build/@@' SHA256SUMS.txt | sha256sum -c -
          python3 - <<'PYCODE'
          import zipfile, plistlib, hashlib
          with zipfile.ZipFile('MixCapture-unsigned.ipa') as z:
              names=z.namelist()
              info=plistlib.loads(z.read('Payload/MixCapture.app/Info.plist'))
              assert info['CFBundleVersion']=='5'
              assert info['CFBundleIdentifier']=='com.mixcapture.pilot'
              assert info['CFBundleDevelopmentRegion']=='en'
              assert info['CFBundleSupportedPlatforms']==['iPhoneOS']
              assert not any(n.lower().endswith(('.wav','.m4a','.mp3','.aac')) for n in names)
              assert not any(n.endswith('small_egy_acft_q8_0.bin') for n in names)
              with z.open('Payload/MixCapture.app/ggml-codeswitch-medium-q8_0.bin') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()=='42ad913750c5487f8fb7bb9d45033fc06443d59d387c797b02632f639d46fbdd'
          print('Verified English build 5, pinned medium model, and no packaged audio.')
          PYCODE
          gh release upload pilot-v0.5.0 MixCapture-unsigned.ipa SHA256SUMS.txt build-info.txt --clobber
          cp ../ui/01-home.png UI-home.png
          cp ../ui/07-home-dark.png UI-home-dark.png
          cp ../ui/02-library.png UI-library.png
          cp ../ui/04-expenses.png UI-expenses.png
          gh release upload pilot-v0.5.0 UI-home.png UI-home-dark.png UI-library.png UI-expenses.png --clobber
          gh release edit pilot-v0.5.0 --draft=false
